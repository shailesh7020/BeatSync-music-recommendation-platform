name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Application & Sync Native Assets
        working-directory: frontend
        run: npm run build:mobile

      - name: Grant Execute Permission to Gradle Wrapper
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatSync-app-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: mobile-v1.0.0
          name: "BeatSync Mobile v1.0.0 (Android APK)"
          body: |
            ## BeatSync AI Music Mobile Application

            Installable Android application (.apk) for the BeatSync music platform.

            ### What's Included:
            - **100% Full Song Playback**: Stream and listen to complete tracks.
            - **Offline Music Downloader**: Save high-quality audio files directly into your phone storage.
            - **Native Ergonomics**: Safe-area insets, dark theme, hardware back button support, and native haptic feedback.
            - **Offline Mode**: Play saved songs with 0 internet connection or in airplane mode.

            ### Installation Instructions:
            1. Download `BeatSync-app-debug.apk` onto your Android phone.
            2. Tap the file in your phone's notification bar or Files app.
            3. If prompted, allow "Install Unknown Apps" for your browser / file manager.
            4. Tap **Install** and open **BeatSync**!
          files: frontend/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
